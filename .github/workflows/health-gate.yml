name: health-gate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: pip install -r requirements.txt
      - name: Fast sanity (ruff/mypy/pytest -k fast)
        run: |
          python -m ruff check .
          python -m mypy --config-file mypy.ini src/core src/policy tests
          python -m pytest -q -k "fast or safety or filters or pipeline or observability"
      - name: Health gate (1d, unknown<=0.3, block<=0.8)
        run: |
          python scripts/health_check.py \
            --logs logs/executions.parquet \
            --days 1 \
            --max-block-rate 0.8 \
            --max-unknown-ratio 0.3 \
            --reasons-map config/reasons_map.yml
